  <body>
    <div class="ph"><span>Phone A (in the Desview, landscape)</span><iframe id="a" src="index.html?bench=a" width="560" height="315"></iframe></div>

    <script>
      // Each frame gets its own localStorage namespace so the two "phones" don't share codes/scripts.

    </script>
  </body>
