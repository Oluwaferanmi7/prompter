<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sapphire</title>
    <meta name="description" content="Free teleprompter with phone-to-phone remote control, built for the Desview." />
    <meta name="theme-color" content="#0b1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sapphire" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="app.css" />
    <script src="vendor/peerjs.min.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- opening animation (cold start only) -->
    <div class="splash" id="splash">
      <div class="splash-mark"><img src="icons/sapphire-mark.png" alt="" width="140" height="140" /></div>
      <div class="splash-word"><span>Sapphire</span></div>
    </div>

    <!-- ============================ THIS PHONE'S TELEPROMPTER ============================ -->
    <section id="prompter" class="view prompter">
      <!-- "Record yourself": the camera sits behind the script -->
      <video class="cam-video" id="p-cam" playsinline muted autoplay hidden></video>
      <div class="stage" id="p-stage">
        <div class="scroller" id="p-scroller">
          <div class="p-content" id="p-content"></div>
          <div class="p-end" aria-hidden="true">■</div>
        </div>
        <div class="cue" id="p-cue" aria-hidden="true"><span class="cue-arrow"></span></div>
        <div class="countdown" id="p-count" hidden></div>
      </div>

      <!-- not mirrored -->
      <div class="p-top" id="p-top">
        <button class="chip home-chip" id="p-home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg></button>
        <span class="wordmark"><b>Sapphire</b></span>
        <span class="spacer"></span>
        <span class="ctrl-dot" id="p-ctrl" hidden title="A remote is controlling this phone"><i></i>Remote in control</span>
        <button class="chip" id="p-remote" hidden><i></i><span></span> ›</button>
      </div>
      <div class="heard" id="p-heard" hidden></div>
      <div class="cam-ui" id="p-camui" hidden>
        <div class="cam-time" data-cam="time" hidden>0:00</div>
        <button class="cam-btn" data-cam="list" aria-label="Recordings"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2" /><path d="M16 10l5-3v10l-5-3" /></svg></button>
        <button class="cam-rec" data-cam="rec" aria-label="Record"><span></span></button>
        <button class="cam-btn" data-cam="flip" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><path d="M9 13a3 3 0 0 1 5-2M15 13a3 3 0 0 1-5 2M14 9v2h-2M10 17v-2h2" /></svg></button>
      </div>
      <!-- control bar + panel are mounted here by controls.js -->
    </section>

    <!-- ============================ REMOTE (controls another phone) ============================ -->
    <section id="remote" class="view remote" hidden>
      <header class="r-top">
        <button class="back-btn" id="r-back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg><span>Home</span></button>
        <div class="r-title" id="r-title">Remote</div>
        <button class="pill" id="r-pill"><span class="dot"></span><span>Not connected</span></button>
      </header>
      <div class="preview-wrap">
        <div class="progress"><span id="r-progress"></span></div>
        <div class="preview" id="r-preview">
          <div class="pv-pad" id="r-padtop"></div>
          <div class="pv-content" id="r-content"></div>
          <div class="pv-pad" id="r-padbot"></div>
        </div>
        <div class="pv-cue" id="r-cue"><span></span></div>
        <div class="pv-meta"><span id="r-left">–:––</span> left</div>
        <div class="heard pv-heard" id="r-heard" hidden></div>
      </div>
      <!-- control bar + panel are mounted here by controls.js -->
    </section>

    <!-- ============================ HOME (what is this device doing?) ============================ -->
    <section id="home" class="view home" hidden></section>

    <!-- ============================ HUB (desktop app: cameras + mics on this computer) ============================ -->
    <section id="hub" class="view hub" hidden></section>

    <!-- ============================ CAMERA FOR THE HUB (phone as one of the Hub's cameras) ============================ -->
    <section id="camfeed" class="view camfeed" hidden></section>

    <div class="toast" id="toast" hidden></div>
  </body>
</html>
