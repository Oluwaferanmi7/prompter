<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>LiM Prompter</title>
    <meta name="description" content="Free teleprompter with phone-to-phone remote control, built for the Desview." />
    <meta name="theme-color" content="#333333" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiM Prompter" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="app.css" />
    <script src="vendor/peerjs.min.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- ============================ THIS PHONE'S TELEPROMPTER ============================ -->
    <section id="prompter" class="view prompter">
      <div class="stage" id="p-stage">
        <div class="scroller" id="p-scroller">
          <div class="p-content" id="p-content"></div>
          <div class="p-end" aria-hidden="true">■</div>
        </div>
        <div class="cue" id="p-cue" aria-hidden="true"><span class="cue-arrow"></span></div>
        <div class="countdown" id="p-count" hidden></div>
      </div>

      <!-- not mirrored -->
      <div class="p-top" id="p-top">
        <span class="wordmark"><b>LiM</b> Prompter</span>
        <span class="spacer"></span>
        <span class="ctrl-dot" id="p-ctrl" hidden title="A remote is controlling this phone"><i></i>Remote in control</span>
        <button class="chip" id="p-remote" hidden><i></i><span></span> ›</button>
      </div>
      <div class="heard" id="p-heard" hidden></div>
      <!-- control bar + panel are mounted here by controls.js -->
    </section>

    <!-- ============================ REMOTE (controls another phone) ============================ -->
    <section id="remote" class="view remote" hidden>
      <header class="r-top">
        <button class="back-btn" id="r-back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg><span>My teleprompter</span></button>
        <div class="r-title" id="r-title">Remote</div>
        <button class="pill" id="r-pill"><span class="dot"></span><span>Not connected</span></button>
      </header>
      <div class="preview-wrap">
        <div class="progress"><span id="r-progress"></span></div>
        <div class="preview" id="r-preview">
          <div class="pv-pad" id="r-padtop"></div>
          <div class="pv-content" id="r-content"></div>
          <div class="pv-pad" id="r-padbot"></div>
        </div>
        <div class="pv-cue" id="r-cue"><span></span></div>
        <div class="pv-meta"><span id="r-left">–:––</span> left</div>
        <div class="heard pv-heard" id="r-heard" hidden></div>
      </div>
      <!-- control bar + panel are mounted here by controls.js -->
    </section>

    <div class="toast" id="toast" hidden></div>
  </body>
</html>
