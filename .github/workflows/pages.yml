name: Deploy to GitHub Pages

# main → https://oluwaferanmi7.github.io/prompter/
# voice branch (if it exists) → https://oluwaferanmi7.github.io/prompter/voice/  (test build)
on:
  push:
    branches: [main, voice]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: voice
          path: voice
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r main/app/. dist/
          if [ -d voice/app ]; then mkdir -p dist/voice && cp -r voice/app/. dist/voice/; fi
          ls -R dist | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
